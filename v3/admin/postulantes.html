<title>Postulantes Indómito</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una columna de lectura; arriba la convocatoria y su cupo, abajo la lista de personas como fichas de mostrador. Sistema visual del sitio V3. */
:root{
  --bg:#ffffff; --ink:#16130f; --mute:#5c554d; --line:#e8e4de; --soft:#f5f3ef; --amber:#8b6f47;
  --ok:#2f6b3f; --warn:#8a5a12; --off:#9b2c1f;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--ink:#efeae2;--mute:#a39b90;--line:#2c2823;--soft:#1d1a16;--amber:#c29a66;--ok:#7fbf8e;--warn:#e0b469;--off:#e58a7d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--ink:#efeae2;--mute:#a39b90;--line:#2c2823;--soft:#1d1a16;--amber:#c29a66;--ok:#7fbf8e;--warn:#e0b469;--off:#e58a7d;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:clamp(24px,6vw,64px);padding-block:clamp(40px,8vw,88px) 96px;display:flex;flex-direction:column;gap:40px}
.k{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0}
h1{font-size:clamp(34px,6vw,56px);line-height:.95;letter-spacing:-.04em;margin:8px 0 0;text-wrap:balance}
.sub{color:var(--mute);margin:10px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{font:inherit;font-size:14px;background:none;color:var(--ink);border:1px solid var(--line);padding:7px 12px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{font:inherit;font-size:14px;background:none;color:var(--ink);border:0;border-bottom:1px solid currentColor;padding:4px 0;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:18px}
.head h2{font-size:28px;letter-spacing:-.02em;margin:4px 0 0;line-height:1.1}
.meter{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.meter b{font:600 32px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.meter span{font-size:13px;color:var(--mute)}
.track{width:180px;height:4px;background:var(--line);position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.counts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.counts strong{color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column}
.p{display:grid;grid-template-columns:1fr auto;gap:10px 28px;padding:24px 0;border-bottom:1px solid var(--line)}
.p .name{font-weight:600;font-size:18px;letter-spacing:-.01em}
.p .when{white-space:nowrap;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.p .contact{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;min-width:0}
.p .contact a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.p .contact a:hover{border-color:var(--ink)}
.p .contact span{color:var(--mute);overflow-wrap:anywhere}
.p .motivo{grid-column:1/-1;margin:2px 0 0;color:var(--ink);max-width:62ch;font-size:15px}
.p .side{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.p .left{display:flex;flex-direction:column;gap:6px;min-width:0}
select.estado{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:6px 8px}
.pill{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 7px;border:1px solid currentColor}
.s-postulado{color:var(--mute)} .s-aceptado{color:var(--amber)} .s-confirmado,.s-asistio{color:var(--ok)}
.s-no-asistio{color:var(--off)} .s-lista-de-espera{color:var(--warn)}
.note{background:var(--soft);padding:18px 20px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.note.err{border-left:3px solid var(--off)}
.empty{color:var(--mute);padding:28px 0}
.foot{font-size:13px;color:var(--mute)}
.saving{opacity:.55}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:560px){.head{grid-template-columns:1fr}.meter{align-items:flex-start}.p{grid-template-columns:1fr}.p .side{grid-row:auto;grid-column:1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px}}
</style>

<div class="wrap">
  <header>
    <p class="k">Indómito · Convocatorias</p>
    <h1>Postulantes</h1>
    <p class="sub">Quiénes se anotaron desde indomitocafe.com/convocatoria. Cambiá el estado de cada persona acá mismo.</p>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="Convocatoria"></div>
    <button class="btn" id="refresh" type="button">Actualizar</button>
  </div>

  <div id="msg" hidden></div>

  <section id="panel">
    <div class="head">
      <div><p class="k" id="conv-k">Cargando</p><h2 id="conv-h">Leyendo la base…</h2></div>
      <div class="meter" id="meter" hidden><b id="meter-n">0</b><span id="meter-t"></span><div class="track"><i id="meter-bar" style="width:0"></i></div></div>
    </div>
    <div class="counts" id="counts" style="margin-top:14px"></div>
    <div class="list" id="list"><p class="empty">Las postulaciones aparecen acá apenas se leen de la base.</p></div>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script>
(function(){
  var SERVER="Airtable", BASE="appNmepcR3NLbZtCH", T_CONV="tblaS4JjnmBZOVJKD", T_POST="tblHoH7hLJfFTJRGd";
  var F={nombre:"fldcxMT7bFPcwp176",email:"fldouUzmBTWdDRIgV",wa:"fld7h846I95Rhb0WF",ig:"fld4wteilMkGePJir",motivo:"fldX401ICjVjIVWYZ",conv:"fldLsNfAgFD341fnP",estado:"fldMZoAA9Qis0VIPv",idioma:"fldDxKqqHOIqoOahZ",recibido:"fldcPki2L92bvVwUF"};
  var C={id:"fldnMqY7PPulXcViP",nombre:"fldJt1V3EZAM9fgLB",estado:"fldoU24qj4oldkpxV",cupo:"fldh2A1HCUMo58X2A"};
  var ESTADOS=["postulado","aceptado","confirmado","asistió","no asistió","lista de espera"];
  var mcp=null, convs=[], posts=[], active=null;
  var $=function(id){return document.getElementById(id)};
  var sel=function(v){return v&&typeof v==="object"?v.name:(v||"")};
  var slug=function(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"-")};
  var el=function(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};

  function showMsg(title,body,isErr){var m=$("msg");m.hidden=false;m.className="note"+(isErr?" err":"");m.textContent="";m.appendChild(el("strong",null,title));if(body)m.appendChild(el("span",null,body))}
  function errCopy(e){
    var c=e&&e.code;
    if(c==="server_not_connected"||c==="selection_required")return ["Falta el conector de Airtable","Agregá Airtable en claude.ai, Configuración → Conectores, y volvé a abrir esta página."];
    if(c==="needs_reauth")return ["Airtable pide volver a conectar","Reconectá Airtable en claude.ai, Configuración → Conectores."];
    if(c==="not_in_manifest")return ["Esta página no tiene permiso para leer Airtable","Habilitá Airtable desde el menú Permisos de la página."];
    if(c==="blocked_by_policy"||c==="approval_required")return ["Tu organización bloquea este acceso","Pedí que habiliten el conector de Airtable para artifacts."];
    if(c==="server_unavailable")return ["Airtable no respondió","Probá Actualizar en un momento."];
    if(c==="tool_error")return ["Airtable rechazó la operación",e.message||""];
    return ["No se pudo leer la base",(e&&e.message)||""];
  }

  function convName(id){var c=convs.find(function(x){return x.id===id});return c?c.nombre:id}
  function renderTabs(){
    var t=$("tabs");t.textContent="";
    var ids=convs.map(function(c){return c.id});
    posts.forEach(function(p){if(p.conv&&ids.indexOf(p.conv)<0)ids.push(p.conv)});
    if(!active||ids.indexOf(active)<0)active=ids[0]||null;
    ids.forEach(function(id){
      var n=posts.filter(function(p){return p.conv===id}).length;
      var b=el("button","tab",convName(id).replace(/^Laboratorio Sensorial: /,"")+" · "+n);
      b.type="button";b.setAttribute("aria-pressed",String(id===active));
      b.onclick=function(){active=id;render()};t.appendChild(b);
    });
  }

  function render(){
    renderTabs();
    var c=convs.find(function(x){return x.id===active})||{id:active,nombre:convName(active)};
    var mine=posts.filter(function(p){return p.conv===active}).sort(function(a,b){return (b.recibido||"").localeCompare(a.recibido||"")});
    $("conv-k").textContent=c.estado?("Convocatoria "+c.estado):"Convocatoria";
    $("conv-h").textContent=c.nombre||"Sin convocatorias";
    var adentro=mine.filter(function(p){return p.estado==="aceptado"||p.estado==="confirmado"||p.estado==="asistió"}).length;
    if(c.cupo){$("meter").hidden=false;$("meter-n").textContent=adentro+" / "+c.cupo;$("meter-t").textContent="lugares asignados";$("meter-bar").style.width=Math.min(100,adentro/c.cupo*100)+"%"}else{$("meter").hidden=true}
    var cs=$("counts");cs.textContent="";
    ESTADOS.forEach(function(s){var n=mine.filter(function(p){return p.estado===s}).length;if(!n)return;var sp=el("span");sp.appendChild(el("strong",null,String(n)));sp.appendChild(document.createTextNode(" "+s));cs.appendChild(sp)});
    var l=$("list");l.textContent="";
    if(!mine.length){l.appendChild(el("p","empty","Todavía no hay nadie anotado en esta convocatoria."));return}
    mine.forEach(function(p){l.appendChild(card(p))});
  }

  function card(p){
    var r=el("article","p");
    var left=el("div","left");
    left.appendChild(el("div","name",p.nombre||"Sin nombre"));
    var ct=el("div","contact");
    if(p.wa){var a=el("a",null,"WhatsApp "+p.wa);a.href="https://wa.me/"+p.wa.replace(/\D/g,"");a.target="_blank";a.rel="noopener";ct.appendChild(a)}
    if(p.email){ct.appendChild(el("span",null,p.email))}
    if(p.ig){var g=el("a",null,"@"+p.ig);g.href="https://www.instagram.com/"+encodeURIComponent(p.ig);g.target="_blank";g.rel="noopener";ct.appendChild(g)}
    left.appendChild(ct);
    r.appendChild(left);
    var side=el("div","side");
    side.appendChild(el("span","pill s-"+slug(p.estado||"postulado"),p.estado||"postulado"));
    var s=el("select","estado");s.id="estado-"+p.id;s.setAttribute("aria-label","Estado de "+(p.nombre||"postulante"));
    ESTADOS.forEach(function(e){var o=el("option",null,e);o.value=e;if(e===p.estado)o.selected=true;s.appendChild(o)});
    s.onchange=function(){setEstado(p,s.value,r,s)};
    side.appendChild(s);
    if(p.recibido){var d=new Date(p.recibido);side.appendChild(el("span","when",d.toLocaleDateString("es-AR",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})))}
    r.appendChild(side);
    if(p.motivo)r.appendChild(el("p","motivo",p.motivo));
    return r;
  }

  function setEstado(p,v,row,s){
    var prev=p.estado;row.classList.add("saving");s.disabled=true;
    mcp.callTool(SERVER,"update_records_for_table",{baseId:BASE,tableId:T_POST,records:[{id:p.id,fields:{[F.estado]:v}}],typecast:true})
      .then(function(){p.estado=v;$("msg").hidden=true;render()})
      .catch(function(e){s.value=prev;row.classList.remove("saving");s.disabled=false;var x=errCopy(e);showMsg("No se guardó el cambio de "+(p.nombre||"esta persona"),x[1]||x[0],true)});
  }

  function load(){
    var btn=$("refresh");btn.disabled=true;btn.textContent="Actualizando…";
    var opts={cache:false};
    Promise.all([
      mcp.callTool(SERVER,"list_records_for_table",{baseId:BASE,tableId:T_CONV,pageSize:200},opts),
      mcp.callTool(SERVER,"list_records_for_table",{baseId:BASE,tableId:T_POST,pageSize:2000},opts)
    ]).then(function(rs){
      var cv=(rs[0].payload&&rs[0].payload.records)||[], ps=(rs[1].payload&&rs[1].payload.records)||[];
      convs=cv.map(function(r){var v=r.cellValuesByFieldId||{};return {id:v[C.id],nombre:v[C.nombre]||v[C.id],estado:sel(v[C.estado]),cupo:v[C.cupo]||null}}).filter(function(c){return c.id});
      convs.sort(function(a,b){return (a.estado==="abierta"?0:1)-(b.estado==="abierta"?0:1)||(a.id==="lista-espera")-(b.id==="lista-espera")});
      posts=ps.map(function(r){var v=r.cellValuesByFieldId||{};return {id:r.id,nombre:v[F.nombre],email:v[F.email],wa:v[F.wa],ig:v[F.ig],motivo:v[F.motivo],conv:v[F.conv]||"lista-espera",estado:sel(v[F.estado])||"postulado",recibido:v[F.recibido]}});
      $("msg").hidden=true;render();
      $("foot").textContent="Leído "+new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+" · "+posts.length+" postulaciones en total.";
    }).catch(function(e){var x=errCopy(e);showMsg(x[0],x[1],true);$("conv-h").textContent="Sin datos"})
    .then(function(){btn.disabled=false;btn.textContent="Actualizar"});
  }

  $("refresh").onclick=function(){if(mcp)load()};
  claude.use("mcp").then(function(m){
    if(!m){showMsg("Esta vista no puede conectarse a Airtable","Abrí la página desde claude.ai con tu cuenta.",true);$("conv-h").textContent="Sin conexión";$("refresh").disabled=true;return}
    mcp=m;load();
  });
})();
</script>
